[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
agent-tool-macro = { path = "tool-macro" }
inventory = { version = "0.3.24", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

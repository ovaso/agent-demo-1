[workspace]
members = ["agent-app", "agent-app-tool", "agent-core", "agent-core/tool-macro", "agent-render-cmd", "agent-tool-debug", "agent-vendor", "agent-vendor-openai", "agent-vendor-anthropic", "agent-vendor-deepseek"]
resolver = "3"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

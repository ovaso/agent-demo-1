[package]
name = "agent-app"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-core = { path = "../agent-core", features = ["sqlite"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rustyline = "18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
